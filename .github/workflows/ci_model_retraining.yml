name: CI Model Retraining with MLflow & Docker

on:
  push:
    branches: [main]
    paths:
      - "MLProject/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn mlflow matplotlib seaborn

      - name: Train model with MLflow
        id: train
        run: |
          cd MLProject
          python modelling.py
          # Save run ID from model_info.json
          echo "RUN_ID=$(python -c "import json; print(json.load(open('model_info.json'))['run_id'])")" >> $GITHUB_OUTPUT
          echo "Run ID saved"

      - name: Upload MLflow artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: MLProject/mlruns/

      - name: Upload trained model files
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            MLProject/**/model.pkl
            MLProject/**/*.png
            MLProject/**/*.csv
            MLProject/model_info.json

      - name: Commit MLflow artifacts back to repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d "MLProject/mlruns" ]; then
            git add MLProject/mlruns/ 2>/dev/null || true
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update: MLflow artifacts from retraining [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Build Docker image with Dockerfile (fallback)
        run: |
          cd MLProject
          docker build -t "loan-default-mlflow:latest" .

      - name: Push Docker image to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_PASSWORD" ]; then
            echo "DOCKER_USERNAME or DOCKER_PASSWORD not set. Skipping Docker push."
            exit 0
          fi
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
          docker tag loan-default-mlflow:latest "$DOCKER_USERNAME/loan-default-mlflow:latest"
          docker push "$DOCKER_USERNAME/loan-default-mlflow:latest"
          echo "Docker image pushed successfully!"
