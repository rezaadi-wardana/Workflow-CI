name: CI Model Retraining with MLflow & Docker

on:
  push:
    branches: [main]
    paths:
      - "MLProject/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn mlflow matplotlib seaborn

      - name: Train model with MLflow
        id: train
        run: |
          cd MLProject
          python modelling.py
          # Save run ID from model_info.json
          echo "RUN_ID=$(python -c "import json; print(json.load(open('model_info.json'))['run_id'])")" >> $GITHUB_OUTPUT
          echo "Run ID saved"

      - name: Upload MLflow artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: MLProject/mlruns/

      - name: Upload trained model files
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            MLProject/**/model.pkl
            MLProject/**/*.png
            MLProject/**/*.csv
            MLProject/model_info.json

      - name: Commit MLflow artifacts back to repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d "MLProject/mlruns" ]; then
            git add MLProject/mlruns/ 2>/dev/null || true
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update: MLflow artifacts from retraining [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Build Docker image with MLflow
        run: |
          cd MLProject
          mlflow models build-docker \
            -m "runs:/${{ steps.train.outputs.RUN_ID }}/random_forest_model" \
            -n "${{ secrets.DOCKER_USERNAME || 'rezaadiwardana' }}/loan-default-mlflow:latest" \
            --env-manager local

      - name: Push Docker image to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          USERNAME="${DOCKER_USERNAME:-rezaadi-wardana}"
          PASSWORD="${DOCKER_PASSWORD:-}"
          if [ -n "$PASSWORD" ]; then
            echo "$PASSWORD" | docker login -u "$USERNAME" --password-stdin
            docker push "$USERNAME/loan-default-mlflow:latest"
          else
            echo "DOCKER_PASSWORD secret not set. Skipping push."
          fi
